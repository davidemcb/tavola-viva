<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="home-btn" aria-label="Torna alla home">
      <svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"></circle>
        <path d="M13 3.2v19.6M6.4 7.2c3.6 2.2 3.6 9.4 0 11.6M19.6 7.2c-3.6 2.2-3.6 9.4 0 11.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
        <circle cx="13" cy="13" r="2.6" fill="currentColor"></circle>
      </svg>
      <span style="text-align:left"><b>Tavola Viva</b><span class="sig">Kinesiologia Studio</span></span>
    </button>
    <div class="search">
      <svg class="mag" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M9.4 9.4 13 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <input id="q" type="search" placeholder="Cerca muscolo, osso, nervo, problema…" autocomplete="off" aria-label="Cerca">
      <div class="res" id="res" hidden></div>
    </div>
    <button class="ico badge" id="queue-btn" aria-label="Playlist di ascolto" title="Playlist">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h9M2 8h9M2 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><path d="M13 7v6.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><circle cx="11.6" cy="13.4" r="1.6" fill="currentColor"></circle></svg>
      <b id="queue-n" hidden>0</b>
    </button>
    <button class="ico" id="me-btn" aria-label="Il mio studio" title="Il mio studio">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.4 4.2 13.4l.7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
    </button>
    <button class="ico" id="theme-btn" aria-label="Cambia tema" title="Tema">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 6.5 6.5A5 5 0 0 1 8 1.5z" fill="currentColor"></path></svg>
    </button>
  </div>
</header>

<main class="page" id="page" tabindex="-1"></main>

<div class="player" id="player" hidden>
  <div class="queue" id="queue" hidden></div>
  <div class="player-in">
    <button class="pbtn" id="p-prev" aria-label="Traccia precedente"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2v10M12 2.5 5 7l7 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
    <button class="pbtn play" id="p-play" aria-label="Riproduci"><svg width="16" height="16" viewBox="0 0 16 16" id="p-icon"><path d="M4 2.5 13 8l-9 5.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
    <button class="pbtn" id="p-next" aria-label="Traccia successiva"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M11 2v10M2 2.5 9 7l-7 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
    <div class="now">
      <b id="p-title">—</b>
      <span id="p-sub">in ascolto</span>
      <div class="pbar"><i id="p-fill"></i></div>
    </div>
    <button class="btn sm" id="p-rate" title="Velocità di lettura">1,0×</button>
    <button class="btn sm" id="p-open" title="Apri la scheda in ascolto">Apri</button>
    <button class="pbtn" id="p-close" aria-label="Chiudi il lettore"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M2 2l9 9M11 2l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
  </div>
</div>
