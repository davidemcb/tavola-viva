<title>AnatomiaPratica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EEF1F0; --surface:#FFFFFF; --surface-2:#F7F9F8;
  --ink:#141D1C; --muted:#5B6B68; --faint:#8A9996;
  --line:#D5DCD9; --line-soft:#E4E9E7;
  --muscle:#A62B3F; --muscle-soft:#F2DEE2;
  --fascia:#2F7A74; --fascia-soft:#DCEBE9;
  --bone:#8C7A52; --bone-soft:#EEE9DC;
  --nerve:#A9760E; --nerve-soft:#F4E9D2;
  --joint:#3E5F93; --joint-soft:#DEE5F1;
  --figure:#DCE3E1; --figure-line:#C3CCC9;
  --ok:#2E7D57; --shadow:0 1px 2px rgba(20,29,28,.06),0 10px 28px -20px rgba(20,29,28,.55);
  --display:"Newsreader",Georgia,serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1413; --surface:#161F1D; --surface-2:#1C2725;
  --ink:#E7EEEB; --muted:#9BAAA6; --faint:#76857F;
  --line:#27332F; --line-soft:#1F2A28;
  --muscle:#E3697C; --muscle-soft:#372024;
  --fascia:#5FB8B0; --fascia-soft:#12302E;
  --bone:#D5C8A9; --bone-soft:#2A2720;
  --nerve:#DCAA48; --nerve-soft:#2E2718;
  --joint:#8FAEDC; --joint-soft:#1B2433;
  --figure:#263230; --figure-line:#35443F;
  --ok:#5FBE8D; --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px #000;
}}
:root[data-theme="dark"]{
  --paper:#0E1413; --surface:#161F1D; --surface-2:#1C2725;
  --ink:#E7EEEB; --muted:#9BAAA6; --faint:#76857F;
  --line:#27332F; --line-soft:#1F2A28;
  --muscle:#E3697C; --muscle-soft:#372024;
  --fascia:#5FB8B0; --fascia-soft:#12302E;
  --bone:#D5C8A9; --bone-soft:#2A2720;
  --nerve:#DCAA48; --nerve-soft:#2E2718;
  --joint:#8FAEDC; --joint-soft:#1B2433;
  --figure:#263230; --figure-line:#35443F;
  --ok:#5FBE8D; --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px #000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.012em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fascia);outline-offset:2px;border-radius:5px}
svg{display:block;max-width:100%}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;min-width:0}
.brand b{font-family:var(--display);font-size:18px;font-weight:600;white-space:nowrap}
.brand .sig{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;margin-top:-3px}
.search{position:relative;flex:1;max-width:340px;margin-left:auto}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:62vh;overflow:auto;z-index:70}
.res button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;padding:9px 12px;background:none;border:0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.res button:last-child{border-bottom:0}
.res button:hover{background:var(--surface-2)}
.res .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:none;width:74px}
.ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px}
.ico:hover{border-color:var(--fascia)}
.ico.badge{position:relative}
.ico.badge b{position:absolute;top:-6px;right:-6px;background:var(--muscle);color:#fff;font-family:var(--mono);font-size:9.5px;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 3px}

/* ---------- page ---------- */
.page{max-width:1180px;margin:0 auto;padding:22px 16px 170px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--fascia);text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.crumbs .sep{opacity:.45}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
button.card{width:100%}
button.card:hover{border-color:var(--fascia);transform:translateY(-1px)}
button.card{transition:transform .15s,border-color .15s}
.card h3{font-size:17px}
.card p{margin:0;font-size:13.5px;color:var(--muted)}

/* porte d'ingresso */
.porta{position:relative;overflow:hidden;padding:17px 16px 15px;min-height:124px;justify-content:flex-end}
.porta .num{position:absolute;top:10px;right:14px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.porta .gl{position:absolute;inset:auto auto -22px -14px;width:96px;height:96px;opacity:.16}
.porta h3{font-size:19px;position:relative}
.porta p{position:relative}
.porta .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- entity sheet ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sheet-head{padding:20px 22px 16px;border-bottom:1px solid var(--line-soft)}
@media(max-width:600px){.sheet-head{padding:16px}}
.sheet-head h1{font-size:clamp(22px,5vw,30px);line-height:1.14;margin:5px 0 6px}
.sheet-head .lat{font-family:var(--display);font-style:italic;color:var(--muted);font-size:15px}
.sheet-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:16px}
@media(max-width:600px){.sheet-body{padding:16px}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.prose{display:flex;flex-direction:column;gap:11px;max-width:66ch}
.prose p{margin:0}
.dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:1px;margin:0;border:1px solid var(--line-soft);border-radius:11px;overflow:hidden;background:var(--line-soft)}
@media(max-width:520px){.dl{grid-template-columns:1fr}}
.dl dt{background:var(--surface-2);padding:9px 11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dl dd{background:var(--surface);padding:9px 11px;margin:0;font-size:13.8px}
.seg{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.seg::after{content:"";flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;line-height:1.25;text-align:left}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.sm{padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--fascia)}
/* pillole di collegamento */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;line-height:1.25;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:currentColor}
.pill::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor;flex:none;opacity:.85}
.pill.m{color:var(--muscle)}.pill.o{color:var(--bone)}.pill.n{color:var(--nerve)}
.pill.a{color:var(--joint)}.pill.c{color:var(--fascia)}.pill.p{color:var(--ink)}
.pill.plain::before{display:none}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* segreto del mestiere */
.secret{border:1px solid color-mix(in srgb,var(--nerve) 40%,var(--line));background:var(--nerve-soft);border-radius:12px;padding:13px 15px;position:relative}
.secret .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--nerve);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.secret p{margin:0;font-size:14px}
.secret.locked p{filter:blur(4px);user-select:none}
.secret .lock{position:absolute;inset:0;display:grid;place-items:center;gap:6px;align-content:center;background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:12px}

/* azioni scheda */
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--fascia)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.on{background:var(--fascia);border-color:var(--fascia);color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* frasi narrate */
.s.speaking{background:var(--fascia-soft);box-shadow:0 0 0 4px var(--fascia-soft);border-radius:3px}

/* ---------- player ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:80;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.player-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.player .now{min-width:0;flex:1}
.player .now b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .now span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.pbtn.play{background:var(--ink);border-color:var(--ink);color:var(--paper);width:42px;height:42px}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--fascia);width:0;transition:width .3s}
.queue{max-width:1180px;margin:0 auto;max-height:44vh;overflow:auto;padding:6px 0 10px}
.qrow{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.qrow .i{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:20px;flex:none}
.qrow.cur{color:var(--fascia);font-weight:500}
.qrow .x{margin-left:auto;background:none;border:0;color:var(--faint);padding:2px 6px}

/* misc */
.stage{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px;display:grid;place-items:center}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.2px}
.tbl th,.tbl td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:400}
.scroller{overflow-x:auto}
.slider{width:100%;accent-color:var(--fascia)}
.ro{background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:7px 10px}
.ro .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block}
.ro .v{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fascia)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.inp{font:inherit;color:var(--ink);background:var(--card,transparent);border:1px solid var(--line,#8884);border-radius:10px;padding:10px 12px;outline:none}.inp:focus{border-color:var(--accent,#2F7A74)}
</style>
