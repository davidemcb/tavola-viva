<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AnatomiaPratica, l'atlante del massaggiatore: anatomia, biomeccanica e posturologia per massoterapisti. Entra dal problema, dal movimento, dal muscolo, dall'osso o dal nervo. Ogni scheda si legge e si ascolta.">
<meta name="theme-color" content="#2F7A74" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} [hidden]{display:none!important} img{max-width:100%}</style>
<title>AnatomiaPratica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EEF1F0; --surface:#FFFFFF; --surface-2:#F7F9F8;
  --ink:#141D1C; --muted:#5B6B68; --faint:#8A9996;
  --line:#D5DCD9; --line-soft:#E4E9E7;
  --muscle:#A62B3F; --muscle-soft:#F2DEE2;
  --fascia:#2F7A74; --fascia-soft:#DCEBE9;
  --bone:#8C7A52; --bone-soft:#EEE9DC;
  --nerve:#A9760E; --nerve-soft:#F4E9D2;
  --joint:#3E5F93; --joint-soft:#DEE5F1;
  --figure:#DCE3E1; --figure-line:#C3CCC9;
  --ok:#2E7D57; --shadow:0 1px 2px rgba(20,29,28,.06),0 10px 28px -20px rgba(20,29,28,.55);
  --display:"Newsreader",Georgia,serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1413; --surface:#161F1D; --surface-2:#1C2725;
  --ink:#E7EEEB; --muted:#9BAAA6; --faint:#76857F;
  --line:#27332F; --line-soft:#1F2A28;
  --muscle:#E3697C; --muscle-soft:#372024;
  --fascia:#5FB8B0; --fascia-soft:#12302E;
  --bone:#D5C8A9; --bone-soft:#2A2720;
  --nerve:#DCAA48; --nerve-soft:#2E2718;
  --joint:#8FAEDC; --joint-soft:#1B2433;
  --figure:#263230; --figure-line:#35443F;
  --ok:#5FBE8D; --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px #000;
}}
:root[data-theme="dark"]{
  --paper:#0E1413; --surface:#161F1D; --surface-2:#1C2725;
  --ink:#E7EEEB; --muted:#9BAAA6; --faint:#76857F;
  --line:#27332F; --line-soft:#1F2A28;
  --muscle:#E3697C; --muscle-soft:#372024;
  --fascia:#5FB8B0; --fascia-soft:#12302E;
  --bone:#D5C8A9; --bone-soft:#2A2720;
  --nerve:#DCAA48; --nerve-soft:#2E2718;
  --joint:#8FAEDC; --joint-soft:#1B2433;
  --figure:#263230; --figure-line:#35443F;
  --ok:#5FBE8D; --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px #000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.012em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fascia);outline-offset:2px;border-radius:5px}
svg{display:block;max-width:100%}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;min-width:0}
.brand b{font-family:var(--display);font-size:18px;font-weight:600;white-space:nowrap}
.brand .sig{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:block;margin-top:-3px}
.search{position:relative;flex:1;max-width:340px;margin-left:auto}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:62vh;overflow:auto;z-index:70}
.res button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;padding:9px 12px;background:none;border:0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.res button:last-child{border-bottom:0}
.res button:hover{background:var(--surface-2)}
.res .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:none;width:74px}
.ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px}
.ico:hover{border-color:var(--fascia)}
.ico.badge{position:relative}
.ico.badge b{position:absolute;top:-6px;right:-6px;background:var(--muscle);color:#fff;font-family:var(--mono);font-size:9.5px;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 3px}

/* ---------- page ---------- */
.page{max-width:1180px;margin:0 auto;padding:22px 16px 170px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--fascia);text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.crumbs .sep{opacity:.45}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
button.card{width:100%}
button.card:hover{border-color:var(--fascia);transform:translateY(-1px)}
button.card{transition:transform .15s,border-color .15s}
.card h3{font-size:17px}
.card p{margin:0;font-size:13.5px;color:var(--muted)}

/* porte d'ingresso */
.porta{position:relative;overflow:hidden;padding:17px 16px 15px;min-height:124px;justify-content:flex-end}
.porta .num{position:absolute;top:10px;right:14px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.porta .gl{position:absolute;inset:auto auto -22px -14px;width:96px;height:96px;opacity:.16}
.porta h3{font-size:19px;position:relative}
.porta p{position:relative}
.porta .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- entity sheet ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sheet-head{padding:20px 22px 16px;border-bottom:1px solid var(--line-soft)}
@media(max-width:600px){.sheet-head{padding:16px}}
.sheet-head h1{font-size:clamp(22px,5vw,30px);line-height:1.14;margin:5px 0 6px}
.sheet-head .lat{font-family:var(--display);font-style:italic;color:var(--muted);font-size:15px}
.sheet-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:16px}
@media(max-width:600px){.sheet-body{padding:16px}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.prose{display:flex;flex-direction:column;gap:11px;max-width:66ch}
.prose p{margin:0}
.dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:1px;margin:0;border:1px solid var(--line-soft);border-radius:11px;overflow:hidden;background:var(--line-soft)}
@media(max-width:520px){.dl{grid-template-columns:1fr}}
.dl dt{background:var(--surface-2);padding:9px 11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dl dd{background:var(--surface);padding:9px 11px;margin:0;font-size:13.8px}
.seg{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.seg::after{content:"";flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;line-height:1.25;text-align:left}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.sm{padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--fascia)}
/* pillole di collegamento */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;line-height:1.25;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:currentColor}
.pill::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor;flex:none;opacity:.85}
.pill.m{color:var(--muscle)}.pill.o{color:var(--bone)}.pill.n{color:var(--nerve)}
.pill.a{color:var(--joint)}.pill.c{color:var(--fascia)}.pill.p{color:var(--ink)}
.pill.plain::before{display:none}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* segreto del mestiere */
.secret{border:1px solid color-mix(in srgb,var(--nerve) 40%,var(--line));background:var(--nerve-soft);border-radius:12px;padding:13px 15px;position:relative}
.secret .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--nerve);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.secret p{margin:0;font-size:14px}
.secret.locked p{filter:blur(4px);user-select:none}
.secret .lock{position:absolute;inset:0;display:grid;place-items:center;gap:6px;align-content:center;background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:12px}

/* azioni scheda */
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--fascia)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.on{background:var(--fascia);border-color:var(--fascia);color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* frasi narrate */
.s.speaking{background:var(--fascia-soft);box-shadow:0 0 0 4px var(--fascia-soft);border-radius:3px}

/* ---------- player ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:80;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.player-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.player .now{min-width:0;flex:1}
.player .now b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .now span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.pbtn.play{background:var(--ink);border-color:var(--ink);color:var(--paper);width:42px;height:42px}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--fascia);width:0;transition:width .3s}
.queue{max-width:1180px;margin:0 auto;max-height:44vh;overflow:auto;padding:6px 0 10px}
.qrow{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.qrow .i{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:20px;flex:none}
.qrow.cur{color:var(--fascia);font-weight:500}
.qrow .x{margin-left:auto;background:none;border:0;color:var(--faint);padding:2px 6px}

/* misc */
.stage{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px;display:grid;place-items:center}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.2px}
.tbl th,.tbl td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:400}
.scroller{overflow-x:auto}
.slider{width:100%;accent-color:var(--fascia)}
.ro{background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:7px 10px}
.ro .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block}
.ro .v{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fascia)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.inp{font:inherit;color:var(--ink);background:var(--card,transparent);border:1px solid var(--line,#8884);border-radius:10px;padding:10px 12px;outline:none}.inp:focus{border-color:var(--accent,#2F7A74)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="home-btn" aria-label="Torna alla home">
      <svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="12" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"></circle>
        <path d="M13 3.2v19.6M6.4 7.2c3.6 2.2 3.6 9.4 0 11.6M19.6 7.2c-3.6 2.2-3.6 9.4 0 11.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
        <circle cx="13" cy="13" r="2.6" fill="currentColor"></circle>
      </svg>
      <span style="text-align:left"><b>AnatomiaPratica</b><span class="sig">Kinesiologia Studio</span></span>
    </button>
    <div class="search">
      <svg class="mag" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M9.4 9.4 13 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <input id="q" type="search" placeholder="Cerca muscolo, osso, nervo, problema…" autocomplete="off" aria-label="Cerca">
      <div class="res" id="res" hidden></div>
    </div>
    <button class="ico badge" id="queue-btn" aria-label="Playlist di ascolto" title="Playlist">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h9M2 8h9M2 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><path d="M13 7v6.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><circle cx="11.6" cy="13.4" r="1.6" fill="currentColor"></circle></svg>
      <b id="queue-n" hidden>0</b>
    </button>
    <button class="ico" id="me-btn" aria-label="Il mio studio" title="Il mio studio">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.4 4.2 13.4l.7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
    </button>
    <button class="ico" id="theme-btn" aria-label="Cambia tema" title="Tema">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 6.5 6.5A5 5 0 0 1 8 1.5z" fill="currentColor"></path></svg>
    </button>
  </div>
</header>

<main class="page" id="page" tabindex="-1"></main>

<div class="player" id="player" hidden>
  <div class="queue" id="queue" hidden></div>
  <div class="player-in">
    <button class="pbtn" id="p-prev" aria-label="Traccia precedente"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2v10M12 2.5 5 7l7 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
    <button class="pbtn play" id="p-play" aria-label="Riproduci"><svg width="16" height="16" viewBox="0 0 16 16" id="p-icon"><path d="M4 2.5 13 8l-9 5.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
    <button class="pbtn" id="p-next" aria-label="Traccia successiva"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M11 2v10M2 2.5 9 7l-7 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
    <div class="now">
      <b id="p-title">—</b>
      <span id="p-sub">in ascolto</span>
      <div class="pbar"><i id="p-fill"></i></div>
    </div>
    <button class="btn sm" id="p-rate" title="Velocità di lettura">1,0×</button>
    <button class="btn sm" id="p-open" title="Apri la scheda in ascolto">Apri</button>
    <button class="pbtn" id="p-close" aria-label="Chiudi il lettore"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M2 2l9 9M11 2l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
  </div>
</div>
<script>
/* =========================================================
   ACCESSO: login con email e password. I contenuti arrivano dal server (/api/dati) solo se
   l'abbonamento è attivo; l'amministratore ha il pannello utenti. Tutto dentro una IIFE:
   nessun nome in comune con l'app, che viene caricata dopo.
   ========================================================= */
(function(){
  const API=(localStorage.getItem("tv.api")||"").replace(/\/$/,"");
  const K="tv.token"; let TOKEN=localStorage.getItem(K)||""; let ME=null; let APP_CARICATA=false;
  const q=s=>document.querySelector(s);
  const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const dataIt=s=>{ if(!s) return ""; const [a,m,g]=s.split("-"); return g+"/"+m+"/"+a; };
  const TESTO_RINNOVO='<p>Per rinnovare: <b>19 € al mese</b> oppure <b>197 € all\'anno</b>.</p><ul style="margin:0;padding-left:18px"><li><b>Bonifico</b>: chiedi l\'IBAN a Davide e indica la tua email nella causale.</li><li><b>Contanti</b>: in studio o a lezione.</li></ul><p>Appena il pagamento è registrato, l\'accesso riparte da solo: non devi fare altro. Scrivi a <a href="mailto:scuderidavide@libero.it">scuderidavide@libero.it</a> o su WhatsApp.</p>';

  async function chiama(path,corpo,metodo){
    const r=await fetch(API+path,{method:metodo||(corpo?"POST":"GET"),headers:Object.assign({"Content-Type":"application/json"},TOKEN?{"Authorization":"Bearer "+TOKEN}:{}),body:corpo?JSON.stringify(corpo):undefined});
    let d={}; const ct=r.headers.get("Content-Type")||"";
    if(ct.indexOf("json")>=0) d=await r.json().catch(()=>({})); else d={testo:await r.text()};
    return {ok:r.ok,status:r.status,data:d};
  }
  function pagina(html){ const p=q("#page"); if(p) p.innerHTML=html; }
  const card=(inner)=>'<div style="max-width:460px;margin:24px auto"><div class="card" style="gap:12px">'+inner+'</div></div>';

  function mostraLogin(msg){
    pagina(card('<span class="eyebrow">AnatomiaPratica</span><h1 style="font-size:24px;margin:0">Accedi</h1>'+
      '<p style="margin:0;color:var(--muted)">L\'atlante del massaggiatore: anatomia, biomeccanica, posturologia, test e trigger point, da leggere e da ascoltare.</p>'+
      '<form id="acc-form" style="display:flex;flex-direction:column;gap:10px">'+
      '<label>Email<br><input name="email" type="email" required autocomplete="username" class="inp" style="width:100%"></label>'+
      '<label>Password<br><input name="password" type="password" required autocomplete="current-password" class="inp" style="width:100%"></label>'+
      (msg?'<p style="color:var(--muscle);margin:0">'+h(msg)+'</p>':'')+
      '<button class="btn primary" type="submit">Entra</button></form>'+
      '<p style="font-size:12.5px;color:var(--faint);margin:0">Non hai ancora le credenziali o hai dimenticato la password? Scrivi a <a href="mailto:scuderidavide@libero.it">scuderidavide@libero.it</a>: l\'accesso costa 19 € al mese o 197 € all\'anno.</p>'));
    q("#acc-form").addEventListener("submit",async e=>{
      e.preventDefault(); const f=new FormData(e.target); const b=e.target.querySelector("button"); b.disabled=true; b.textContent="Un momento…";
      const r=await chiama("/api/login",{email:f.get("email"),password:f.get("password")});
      if(!r.ok){ mostraLogin(r.data.errore||"Accesso non riuscito"); return; }
      TOKEN=r.data.token; localStorage.setItem(K,TOKEN); ME=r.data; dopoLogin();
    });
  }
  function mostraScaduto(){
    const a=ME.abbonamento;
    pagina(card('<span class="eyebrow">Abbonamento</span><h1 style="font-size:24px;margin:0">'+(a?'Accesso scaduto il '+h(dataIt(a.scadenza)):'Nessun abbonamento attivo')+'</h1>'+
      '<p style="margin:0">Ciao '+h(ME.utente.nome||ME.utente.email)+'. '+(a?'Il tuo accesso '+h(a.piano)+' è terminato.':'Il tuo account esiste ma non è ancora stato attivato.')+'</p>'+TESTO_RINNOVO+
      '<div class="acts"><button class="btn sm" id="acc-ricontrolla">Ho pagato: ricontrolla</button><button class="btn sm" id="acc-esci">Esci</button></div>'));
    q("#acc-esci").onclick=esci; q("#acc-ricontrolla").onclick=avvio;
  }
  function mostraCambioPassword(obbligatorio){
    pagina(card('<span class="eyebrow">Sicurezza</span><h1 style="font-size:22px;margin:0">'+(obbligatorio?'Scegli la tua password':'Cambia password')+'</h1>'+
      (obbligatorio?'<p style="margin:0;color:var(--muted)">Quella che hai ricevuto è provvisoria: scegline una tua (almeno 8 caratteri).</p>':'')+
      '<form id="pw-form" style="display:flex;flex-direction:column;gap:10px">'+
      '<label>Password attuale<br><input name="vecchia" type="password" required autocomplete="current-password" class="inp" style="width:100%"></label>'+
      '<label>Nuova password<br><input name="nuova" type="password" required minlength="8" autocomplete="new-password" class="inp" style="width:100%"></label>'+
      '<label>Ripeti la nuova password<br><input name="nuova2" type="password" required minlength="8" autocomplete="new-password" class="inp" style="width:100%"></label>'+
      '<p id="pw-err" style="color:var(--muscle);margin:0"></p>'+
      '<div class="acts"><button class="btn primary" type="submit">Salva</button>'+(obbligatorio?'':'<button class="btn sm" type="button" id="pw-annulla">Annulla</button>')+'</div></form>'));
    if(!obbligatorio) q("#pw-annulla").onclick=()=>{ location.reload(); };
    q("#pw-form").addEventListener("submit",async e=>{
      e.preventDefault(); const f=new FormData(e.target);
      if(f.get("nuova")!==f.get("nuova2")){ q("#pw-err").textContent="Le due password non coincidono."; return; }
      const r=await chiama("/api/password",{vecchia:f.get("vecchia"),nuova:f.get("nuova")});
      if(!r.ok){ q("#pw-err").textContent=r.data.errore||"Non riuscito"; return; }
      ME.utente.cambia_password=false; if(obbligatorio) dopoLogin(); else location.reload();
    });
  }
  async function esci(){ try{ await chiama("/api/logout",{}); }catch(e){} TOKEN=""; localStorage.removeItem(K); location.hash="#/home/"; location.reload(); }

  async function caricaApp(){
    pagina(card('<span class="eyebrow">AnatomiaPratica</span><h1 style="font-size:22px;margin:0">Carico le schede…</h1><div class="bar"><i style="width:30%"></i></div>'));
    const r=await fetch(API+"/api/dati",{headers:{"Authorization":"Bearer "+TOKEN}});
    if(r.status===402){ ME=(await r.json()); mostraScaduto(); return; }
    if(!r.ok){ pagina(card('<p>Non riesco a caricare i contenuti ('+r.status+'). Riprova fra poco.</p><button class="btn sm" id="acc-esci">Esci</button>')); q("#acc-esci").onclick=esci; return; }
    const testo=await r.text();
    pagina("");
    const parti=testo.split(/\r?\n\/\*@@SEP@@\*\/\r?\n/);
    for(const p of parti){
      if(!p.trim()) continue;
      if(p.indexOf("/*CSS*/")===0){ const s=document.createElement("style"); s.textContent=p.slice(7); document.head.appendChild(s); }
      else { const s=document.createElement("script"); s.textContent=p; document.body.appendChild(s); }
    }
    APP_CARICATA=true; barra();
  }
  function barra(){
    let b=q("#abbo-bar"); if(!b){ b=document.createElement("div"); b.id="abbo-bar"; const page=q("#page"); page.parentNode.insertBefore(b,page); }
    const a=ME.abbonamento; const admin=ME.utente.ruolo==="admin";
    const giorni=a&&a.attivo?a.giorni:0; const avviso=a&&a.attivo&&giorni<=7;
    b.innerHTML='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:6px 0 2px">'+
      '<span>'+h(ME.utente.nome||ME.utente.email)+(admin?' · amministratore':'')+'</span>'+
      (a?'<span style="'+(avviso?'color:var(--muscle);font-weight:600':'')+'">'+(a.attivo?'accesso fino al '+h(dataIt(a.scadenza))+' ('+giorni+' giorn'+(giorni===1?'o':'i')+')':'abbonamento scaduto')+'</span>':'')+
      (avviso?'<span style="color:var(--muscle)">· rinnova per non interrompere</span>':'')+
      '<span style="margin-left:auto;display:flex;gap:6px">'+(admin?'<button class="btn sm" id="abbo-pannello">Pannello utenti</button>':'')+'<button class="btn sm" id="abbo-pw">Password</button><button class="btn sm" id="abbo-esci">Esci</button></span></div>';
    q("#abbo-esci").onclick=esci; q("#abbo-pw").onclick=()=>mostraCambioPassword(false);
    if(admin) q("#abbo-pannello").onclick=apriPannello;
  }
  async function dopoLogin(){
    if(ME.utente.cambia_password){ mostraCambioPassword(true); return; }
    if(!ME.accesso){ mostraScaduto(); return; }
    if(APP_CARICATA){ location.reload(); return; }
    await caricaApp();
  }
  async function avvio(){
    if(!TOKEN){ mostraLogin(); return; }
    const r=await chiama("/api/me");
    if(r.status===401||r.status===403){ TOKEN=""; localStorage.removeItem(K); mostraLogin(r.data.errore); return; }
    if(!r.ok){ pagina(card('<p>Il server non risponde ('+r.status+'). Riprova fra poco.</p>')); return; }
    ME=r.data; dopoLogin();
  }

  /* ---------- pannello dell'amministratore ---------- */
  let UT=[];
  function ov(){ let o=q("#admin-ov"); if(!o){ o=document.createElement("div"); o.id="admin-ov"; o.style.cssText="position:fixed;inset:0;z-index:60;background:var(--bg,#fff);overflow:auto;padding:16px"; document.body.appendChild(o); } return o; }
  async function apriPannello(){ const o=ov(); o.innerHTML='<p>Carico…</p>'; const r=await chiama("/api/admin/utenti"); UT=r.ok?r.data.utenti:[]; disegnaPannello(); }
  function disegnaPannello(msg){
    const o=ov(); const t=new Date().toISOString().slice(0,10);
    const attivi=UT.filter(u=>u.abbonato).length, inScad=UT.filter(u=>u.abbonato&&u.giorni<=7).length, scaduti=UT.filter(u=>!u.abbonato&&u.ruolo!=="admin").length;
    const riga=u=>'<tr'+(u.attivo?'':' style="opacity:.55"')+'><td><b>'+h(u.nome||"")+'</b><br><span class="mono" style="font-size:12px">'+h(u.email)+'</span>'+(u.ruolo==="admin"?' <span class="eyebrow">admin</span>':'')+'</td>'+
      '<td>'+(u.scadenza?h(u.piano)+'<br>'+(u.abbonato?'<span style="color:var(--ok)">fino al '+h(dataIt(u.scadenza))+' ('+u.giorni+' gg)</span>':'<span style="color:var(--muscle)">scaduto il '+h(dataIt(u.scadenza))+'</span>'):'<span style="color:var(--faint)">mai attivato</span>')+'</td>'+
      '<td style="font-size:12px">'+(u.ultimo_accesso?h(u.ultimo_accesso.slice(0,16).replace("T"," ")):"mai")+(u.cambia_password?'<br><span style="color:var(--faint)">password provvisoria</span>':'')+'</td>'+
      '<td><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn sm" data-adm="attiva" data-id="'+u.id+'">Attiva / prolunga</button>'+
      '<button class="btn sm" data-adm="stato" data-id="'+u.id+'" data-v="'+(u.attivo?0:1)+'">'+(u.attivo?"Blocca":"Sblocca")+'</button>'+
      '<button class="btn sm" data-adm="reset" data-id="'+u.id+'">Nuova password</button>'+
      '<button class="btn sm" data-adm="storico" data-id="'+u.id+'">Storico</button>'+
      '<button class="btn sm" data-adm="elimina" data-id="'+u.id+'" style="color:var(--muscle)">Elimina</button></div><div id="adm-out-'+u.id+'" style="font-size:12.5px;margin-top:4px"></div></td></tr>';
    o.innerHTML='<div style="max-width:1100px;margin:0 auto">'+
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><h1 style="font-size:24px;margin:0">Pannello utenti</h1><span style="color:var(--muted);font-size:13px">'+UT.length+' utenti · '+attivi+' attivi · '+inScad+' in scadenza entro 7 giorni · '+scaduti+' scaduti o mai attivati</span>'+
      '<button class="btn sm" id="adm-chiudi" style="margin-left:auto">Chiudi</button></div>'+
      (msg?'<div class="card" style="margin-bottom:12px;border-color:var(--ok)">'+msg+'</div>':'')+
      '<details class="card" style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:600">Nuovo utente</summary>'+
      '<form id="adm-nuovo" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px">'+
      '<input name="email" type="email" required placeholder="email" class="inp"><input name="nome" placeholder="nome e cognome" class="inp">'+
      '<select name="piano" class="inp"><option value="">Solo account (attivo dopo)</option><option value="mensile">Mensile · 19 €</option><option value="annuale">Annuale · 197 €</option><option value="giorni">Giorni (prova)</option><option value="omaggio">Omaggio</option></select>'+
      '<input name="giorni" type="number" min="1" placeholder="giorni (per prova/omaggio)" class="inp"><select name="metodo" class="inp"><option value="contanti">Contanti</option><option value="bonifico">Bonifico</option><option value="omaggio">Omaggio</option></select>'+
      '<input name="importo" type="number" step="0.01" placeholder="importo € (vuoto = listino)" class="inp"><input name="nota" placeholder="nota (es. corso 2026)" class="inp">'+
      '<button class="btn primary" type="submit">Crea</button></form><p style="font-size:12px;color:var(--faint);margin:8px 0 0">La password provvisoria compare qui sotto: comunicala all\'allievo, che al primo accesso ne sceglie una sua.</p><div id="adm-nuovo-out"></div></details>'+
      '<div class="scroller"><table class="tbl"><thead><tr><th>Utente</th><th>Abbonamento</th><th>Ultimo accesso</th><th>Azioni</th></tr></thead><tbody>'+UT.map(riga).join("")+'</tbody></table></div>'+
      '<div id="adm-dialogo"></div></div>';
    q("#adm-chiudi").onclick=()=>{ o.remove(); };
    q("#adm-nuovo").addEventListener("submit",async e=>{ e.preventDefault(); const f=Object.fromEntries(new FormData(e.target).entries()); const r=await chiama("/api/admin/utente",f);
      if(!r.ok){ q("#adm-nuovo-out").innerHTML='<p style="color:var(--muscle)">'+h(r.data.errore)+'</p>'; return; }
      await apriPannello(); disegnaPannello('<b>Utente creato.</b> Email: <span class="mono">'+h(f.email)+'</span> · password provvisoria: <b class="mono" style="font-size:16px">'+h(r.data.password)+'</b>'+(r.data.abbonamento?' · attivo fino al '+h(dataIt(r.data.abbonamento.scadenza)):'')+pulsantiCredenziali(f.email,r.data.password,r.data.abbonamento&&r.data.abbonamento.scadenza,f.nome)); });
    o.querySelectorAll("[data-adm]").forEach(b=>b.onclick=()=>azione(b.getAttribute("data-adm"),parseInt(b.getAttribute("data-id"),10),b));
  }
  async function azione(a,id,btn){
    const u=UT.find(x=>x.id===id); const out=q("#adm-out-"+id);
    if(a==="stato"){ await chiama("/api/admin/stato",{utente_id:id,attivo:btn.getAttribute("data-v")==="1"}); return apriPannello(); }
    if(a==="reset"){ if(!confirm("Generare una nuova password provvisoria per "+u.email+"? Quella attuale smette di funzionare.")) return; const r=await chiama("/api/admin/reset",{utente_id:id}); out.innerHTML=r.ok?'Nuova password provvisoria: <b class="mono" style="font-size:15px">'+h(r.data.password)+'</b>'+pulsantiCredenziali(u.email,r.data.password,u.abbonato?u.scadenza:null,u.nome):'<span style="color:var(--muscle)">'+h(r.data.errore)+'</span>'; return; }
    if(a==="elimina"){ if(!confirm("Eliminare definitivamente "+u.email+" con tutto lo storico?")) return; await chiama("/api/admin/elimina",{utente_id:id}); return apriPannello(); }
    if(a==="storico"){ const r=await chiama("/api/admin/abbonamenti?utente_id="+id); const L=r.ok?r.data.abbonamenti:[];
      out.innerHTML=L.length?'<table class="tbl" style="font-size:12px"><tr><th>Piano</th><th>Dal</th><th>Al</th><th>Metodo</th><th>€</th><th>Nota</th><th></th></tr>'+L.map(x=>'<tr><td>'+h(x.piano)+'</td><td>'+h(dataIt(x.inizio))+'</td><td>'+h(dataIt(x.scadenza))+'</td><td>'+h(x.metodo||"")+'</td><td>'+(x.importo!=null?x.importo:"")+'</td><td>'+h(x.nota||"")+'</td><td><button class="btn sm" data-sc="'+x.id+'">Cambia scadenza</button></td></tr>').join("")+'</table>':'Nessun abbonamento.';
      out.querySelectorAll("[data-sc]").forEach(b=>b.onclick=async()=>{ const d=prompt("Nuova data di scadenza (AAAA-MM-GG):"); if(!d) return; const r2=await chiama("/api/admin/scadenza",{abbonamento_id:parseInt(b.getAttribute("data-sc"),10),scadenza:d}); if(!r2.ok) alert(r2.data.errore); apriPannello(); }); return; }
    if(a==="attiva"){
      out.innerHTML='<form class="adm-att" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:6px">'+
        '<select name="piano" class="inp"><option value="mensile">Mensile · 19 €</option><option value="annuale">Annuale · 197 €</option><option value="giorni">Giorni</option><option value="omaggio">Omaggio</option></select>'+
        '<input name="giorni" type="number" min="1" placeholder="giorni" class="inp"><input name="inizio" type="date" class="inp" title="inizio (vuoto = oggi, o dal giorno dopo la scadenza attuale)">'+
        '<select name="metodo" class="inp"><option value="contanti">Contanti</option><option value="bonifico">Bonifico</option><option value="omaggio">Omaggio</option></select>'+
        '<input name="importo" type="number" step="0.01" placeholder="importo €" class="inp"><input name="nota" placeholder="nota" class="inp">'+
        '<button class="btn primary sm" type="submit">Conferma</button><button class="btn sm" type="button" data-ann="1">Annulla</button></form>'+
        '<p style="font-size:12px;color:var(--faint);margin:4px 0 0">Se l\'abbonamento è ancora attivo, il nuovo periodo parte dal giorno dopo la scadenza: nessun giorno perso.</p>';
      const f=out.querySelector("form"); f.querySelector("[data-ann]").onclick=()=>{ out.innerHTML=""; };
      f.addEventListener("submit",async e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(f).entries()); d.utente_id=id; const r=await chiama("/api/admin/attiva",d);
        if(!r.ok){ out.innerHTML='<span style="color:var(--muscle)">'+h(r.data.errore)+'</span>'; return; } await apriPannello(); disegnaPannello('<b>'+h(u.email)+'</b>: '+h(d.piano)+' attivo dal '+h(dataIt(r.data.abbonamento.inizio))+' al '+h(dataIt(r.data.abbonamento.scadenza))+'.'); });
    }
  }
  function messaggioCredenziali(email,pw,scadenza,nome){
    const link=location.origin+location.pathname;
    return "Ciao "+(nome||"")+"! Ecco il tuo accesso ad AnatomiaPratica, l'atlante del massaggiatore."+"\n"+"\n"+"Apri: "+link+"\n"+"Email: "+email+"\n"+"Password provvisoria: "+pw+"\n"+"\n"+"Al primo accesso scegli la tua password. "+(scadenza?"L'accesso vale fino al "+dataIt(scadenza)+".":"")+"\n"+"Sul telefono: menu del browser > Aggiungi alla schermata Home, e diventa un'app."+"\n"+"\n"+"Buono studio! Davide";
  }
  function pulsantiCredenziali(email,pw,scadenza,nome){
    const m=messaggioCredenziali(email,pw,scadenza,nome);
    return '<div class="acts" style="margin-top:6px"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(m)+'">Invia su WhatsApp</a>'+
      '<a class="btn sm" href="mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent("Il tuo accesso ad AnatomiaPratica")+'&body='+encodeURIComponent(m)+'">Invia per e-mail</a>'+
      '<button class="btn sm" type="button" data-copia="'+h(m)+'">Copia messaggio</button></div>';
  }
  document.addEventListener("click",e=>{ const b=e.target.closest("[data-copia]"); if(!b) return; navigator.clipboard.writeText(b.getAttribute("data-copia")).then(()=>{ b.textContent="Copiato"; setTimeout(()=>b.textContent="Copia messaggio",1500); }); });
  window.ACCESSO={esci:esci,me:()=>ME};
  document.addEventListener("DOMContentLoaded",avvio);
})();
</script>

/* Solo sul sito: installabile e consultabile anche senza rete, dopo la prima visita */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
